name: Deploy public website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the website
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Use pnpm 11.13.1
        shell: bash
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.13.1 --activate
          pnpm --version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and validate the website
        run: pnpm site:check
      - name: Apply stats database migrations
        working-directory: site/worker
        run: npx --yes wrangler@4.137.0 d1 migrations apply garden-desk-stats --remote
      - name: Deploy to Cloudflare
        working-directory: site/worker
        run: npx --yes wrangler@4.137.0 deploy
